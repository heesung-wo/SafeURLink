name: Build and deploy signatures

on:
  workflow_dispatch:
  schedule:
    # KST 00:17, 하루 한 번(예약 작업은 지연될 수 있음)
    - cron: '17 15 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-signatures.yml'
      - 'safe-ur-link/scripts/**'
      - 'safe-ur-link/core/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-signatures
  cancel-in-progress: false

# 배포 오류 방지를위해 jobs와 deploy 분리
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: safe-ur-link
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
      - uses: actions/cache@v5
      - uses: actions/upload-artifact@v5
        with:
          node-version: '22'

      - name: Determine UTC date for PhishTank cache
        id: utc_date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Cache PhishTank public feed for the day
        uses: actions/cache@v4
        with:
          path: safe-ur-link/.cache/phishtank-daily.json
          key: phishtank-public-${{ steps.utc_date.outputs.day }}

      - name: Test
        run: npm test

      - name: Collect and build public feed
        env:
          PREVIOUS_FEED_URL: 'https://heesung-wo.github.io/SafeURLink/signatures.json'
          ALLOW_FIRST_DEPLOY: 'false'
          OPTIONAL_SOURCES: 'PhishingDB,PhishTank, ThreatFox'
          ABUSE_CH_AUTH_KEY: ${{ secrets.ABUSE_CH_AUTH_KEY }}
          PHISHTANK_KEY: ${{ secrets.PHISHTANK_KEY }}
          PHISHTANK_USER_AGENT: ${{ vars.PHISHTANK_USER_AGENT }}
          PUBLISH_URLHAUS: 'true'
          PUBLISH_THREATFOX: 'true'
          PUBLISH_PHISHTANK: 'true'
          PUBLISH_PHISHING_DB: 'true'
          REDISTRIBUTION_CONFIRMED: 'true'
        run: npm run build:feed

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: safe-ur-link/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
